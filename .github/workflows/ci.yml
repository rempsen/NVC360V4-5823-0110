name: CI

on:
  push:
    # Feature branches run CI too. Without this, work on a branch is unverified
    # until it reaches main or someone opens a pull request — which is how the
    # container image sat unbuilt after its first push.
    branches: [main, master, "infra/**", "feat/**", "fix/**", "chore/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Unit tests need a real Postgres to run against (no SQLite ":memory:"
    # equivalent exists) — see packages/web/src/api/database/__tests__/setup.ts,
    # which defaults to exactly this connection string.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nvc360
          POSTGRES_PASSWORD: nvc360_local
          POSTGRES_DB: nvc360
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nvc360 -d nvc360"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (web — the hardened surface; gates the build)
        working-directory: packages/web
        run: bunx tsc --noEmit

      - name: Typecheck (mobile + desktop — non-blocking backlog)
        run: bun run typecheck
        continue-on-error: true

      - name: Lint (blocking — a11y/hooks backlog burned down to zero)
        run: bun run lint

      - name: Unit tests
        working-directory: packages/web
        run: bun test src/shared/__tests__ src/api/lib/__tests__ src/api/routes/__tests__ src/services/__tests__

      - name: Migration drift check (schema.ts must match committed drizzle/ migrations)
        working-directory: packages/web
        env:
          # `generate` does not open a connection; a placeholder satisfies the loader.
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
        run: |
          # Migration history is committed under packages/web/drizzle/ (baselined
          # 2026-07-03). If schema.ts drifts from the committed migrations without
          # a new migration being generated and committed, this fails the build —
          # forcing `bun run db:generate` before merge instead of silent db:push.
          cp -r drizzle /tmp/drizzle-committed
          bunx drizzle-kit generate --name ci_drift_check
          if ! diff -rq /tmp/drizzle-committed drizzle >/dev/null 2>&1; then
            echo "::error::Schema changed but no migration was committed. Run 'bun run db:generate' in packages/web, commit the new drizzle/*.sql file, then push."
            diff -rq /tmp/drizzle-committed drizzle || true
            exit 1
          fi

  # Builds the production container image on every push/PR. This is the artifact
  # staging and (later) production deploy from, so a broken Dockerfile must fail
  # the build here rather than at deploy time. No registry push yet — that lands
  # with the CD workflow once the AWS staging target exists.
  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nvc360-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SENTRY_ENV=ci

      - name: Smoke test — container boots and binds its port
        run: |
          # No database or third-party credentials are provided, so the app is
          # expected to log connection errors. What we assert is narrower and
          # still valuable: the image starts, Bun resolves every server-side
          # import, and the HTTP listener binds. An import-time or module-
          # resolution regression (the realistic Dockerfile failure mode) fails
          # here. Deeper health checking belongs to the staging smoke test.
          docker run -d --name nvc360-smoke -p 4200:4200 \
            -e PORT=4200 \
            -e DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder" \
            -e BETTER_AUTH_SECRET="ci-smoke-secret-not-a-real-key" \
            nvc360-web:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:4200/"; then
              echo "Container served an HTTP response."
              docker rm -f nvc360-smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container never served an HTTP response on :4200"
          docker logs nvc360-smoke || true
          docker rm -f nvc360-smoke
          exit 1
